<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>MyCalc</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #111;
  --panel: #1d1d1d;
  --display: #242424;
  --button: #333;
  --scientific: #505050;
  --text: #fff;
  --operator: #ff9500;
  --danger: #d9534f;
  --equal: #28a745;
  --border: #444;
}

body.light {
  --bg: #f2f2f2;
  --panel: #fff;
  --display: #e9e9e9;
  --button: #ddd;
  --scientific: #c8c8c8;
  --text: #111;
  --border: #ccc;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.calculator {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 12px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.title {
  font-size: 24px;
  font-weight: bold;
}

.header button {
  width: 42px;
  height: 42px;
  font-size: 20px;
  background: var(--button);
}

#display {
  width: 100%;
  height: 105px;
  background: var(--display);
  color: var(--text);
  border: none;
  border-radius: 18px;
  font-size: 36px;
  text-align: right;
  padding: 15px;
  outline: none;
  margin-bottom: 10px;
}

#mode {
  text-align: right;
  font-size: 12px;
  opacity: .65;
  margin: -5px 5px 8px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

button {
  height: 62px;
  border: none;
  border-radius: 14px;
  background: var(--button);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  transition: transform .08s;
}

button:active {
  transform: scale(.93);
}

.scientific {
  background: var(--scientific);
  font-size: 15px;
}

.operator {
  background: var(--operator);
  color: white;
}

.danger {
  background: var(--danger);
  color: white;
}

.equal {
  background: var(--equal);
  color: white;
}

.wide {
  grid-column: span 2;
}

.history {
  margin-top: 15px;
  background: var(--panel);
  border-radius: 15px;
  padding: 12px;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.history h3 {
  margin: 0;
}

.small-button {
  height: 36px;
  padding: 0 12px;
  font-size: 13px;
}

#historyList {
  max-height: 180px;
  overflow-y: auto;
  margin-top: 8px;
}

.history-item {
  padding: 9px 4px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  word-break: break-all;
}

.history-item:active {
  background: var(--button);
}

.memory {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-bottom: 7px;
}

.memory button {
  height: 42px;
  font-size: 14px;
}

@media (orientation: landscape) {
  .calculator {
    max-width: 800px;
  }

  #display {
    height: 75px;
    font-size: 30px;
  }

  button {
    height: 50px;
  }
}
</style>
</head>

<body>

<div class="calculator">

  <div class="header">
    <div class="title">MyCalc</div>
    <button onclick="toggleTheme()" id="themeButton">☀️</button>
  </div>

  <div id="mode">DEG</div>

  <input id="display" value="0" readonly>

  <div class="memory">
    <button onclick="memoryClear()">MC</button>
    <button onclick="memoryRecall()">MR</button>
    <button onclick="memoryAdd()">M+</button>
    <button onclick="memorySubtract()">M−</button>
  </div>

  <div class="buttons">

    <button class="scientific" onclick="insertConstant('Math.PI')">π</button>
    <button class="scientific" onclick="insertConstant('Math.E')">e</button>
    <button class="scientific" onclick="sqrt()">√</button>
    <button class="scientific" onclick="square()">x²</button>

    <button class="scientific" onclick="sin()">sin</button>
    <button class="scientific" onclick="cos()">cos</button>
    <button class="scientific" onclick="tan()">tan</button>
    <button class="scientific" onclick="log10()">log</button>

    <button class="scientific" onclick="asin()">sin⁻¹</button>
    <button class="scientific" onclick="acos()">cos⁻¹</button>
    <button class="scientific" onclick="atan()">tan⁻¹</button>
    <button class="scientific" onclick="ln()">ln</button>

    <button class="scientific" onclick="power()">xʸ</button>
    <button class="scientific" onclick="tenPower()">10ˣ</button>
    <button class="scientific" onclick="factorial()">x!</button>
    <button class="scientific" onclick="percent()">%</button>

    <button class="danger" onclick="clearDisplay()">AC</button>
    <button onclick="deleteLast()">⌫</button>
    <button onclick="addValue('(')">(</button>
    <button onclick="addValue(')')">)</button>

    <button onclick="addValue('7')">7</button>
    <button onclick="addValue('8')">8</button>
    <button onclick="addValue('9')">9</button>
    <button class="operator" onclick="addValue('/')">÷</button>

    <button onclick="addValue('4')">4</button>
    <button onclick="addValue('5')">5</button>
    <button onclick="addValue('6')">6</button>
    <button class="operator" onclick="addValue('*')">×</button>

    <button onclick="addValue('1')">1</button>
    <button onclick="addValue('2')">2</button>
    <button onclick="addValue('3')">3</button>
    <button class="operator" onclick="addValue('-')">−</button>

    <button class="wide" onclick="addValue('0')">0</button>
    <button onclick="addValue('.')">.</button>
    <button class="operator" onclick="addValue('+')">+</button>

    <button class="equal wide" onclick="calculate()">=</button>
    <button onclick="clearDisplay()">C</button>

  </div>

  <div class="history">

    <div class="history-header">
      <h3>History</h3>
      <button class="small-button" onclick="clearHistory()">Clear</button>
    </div>

    <div id="historyList"></div>

  </div>

</div>

<script>

const display = document.getElementById("display");
const historyList = document.getElementById("historyList");

let memory = Number(localStorage.getItem("mycalc-memory")) || 0;
let darkMode = localStorage.getItem("mycalc-theme") !== "light";

if (!darkMode) {
  document.body.classList.add("light");
}


// -------------------------
// BUTTON FEEDBACK
// -------------------------

function feedback() {
  if (navigator.vibrate) {
    navigator.vibrate(15);
  }
}

// DISPLAY
