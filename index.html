<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#111111">

  <link rel="manifest" href="manifest.json">

  <title>MyCalc</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .calculator {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 15px;
    }

    .app-title {
      text-align: center;
      font-size: 24px;
      margin: 5px 0 15px;
    }

    #display {
      width: 100%;
      height: 95px;
      background: #222;
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 36px;
      text-align: right;
      padding: 15px;
      margin-bottom: 12px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      background: #333;
      color: white;
      cursor: pointer;
      transition: transform 0.08s;
    }

    button:active {
      transform: scale(0.94);
    }

    .scientific {
      background: #555;
      font-size: 17px;
    }

    .operator {
      background: #ff9500;
    }

    .clear {
      background: #d9534f;
    }

    .equals {
      background: #28a745;
    }

    .history {
      margin-top: 18px;
      background: #222;
      border-radius: 15px;
      padding: 12px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .history-header h3 {
      margin: 0;
    }

    #clearHistory {
      height: 38px;
      padding: 0 12px;
      font-size: 14px;
      background: #444;
    }

    #historyList {
      max-height: 180px;
      overflow-y: auto;
    }

    .history-item {
      padding: 9px 5px;
      border-bottom: 1px solid #444;
      font-size: 15px;
      word-break: break-all;
    }

    .empty-history {
      color: #888;
      font-size: 14px;
      padding: 8px 0;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="app-title">
      MyCalc
    </div>

    <input
      id="display"
      type="text"
      value="0"
      readonly
      aria-label="Calculator display"
    >

    <div class="buttons">

      <!-- Scientific functions -->
      <button class="scientific" onclick="sqrt()">√</button>
      <button class="scientific" onclick="square()">x²</button>
      <button class="scientific" onclick="power()">xʸ</button>
      <button class="scientific" onclick="percent()">%</button>

      <button class="scientific" onclick="sin()">sin</button>
      <button class="scientific" onclick="cos()">cos</button>
      <button class="scientific" onclick="tan()">tan</button>
      <button class="scientific" onclick="log()">log</button>

      <!-- Control buttons -->
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="addValue('(')">(</button>
      <button onclick="addValue(')')">)</button>

      <!-- Numbers -->
      <button onclick="addValue('7')">7</button>
      <button onclick="addValue('8')">8</button>
      <button onclick="addValue('9')">9</button>
      <button class="operator" onclick="addValue('/')">÷</button>

      <button onclick="addValue('4')">4</button>
      <button onclick="addValue('5')">5</button>
      <button onclick="addValue('6')">6</button>
      <button class="operator" onclick="addValue('*')">×</button>

      <button onclick="addValue('1')">1</button>
      <button onclick="addValue('2')">2</button>
      <button onclick="addValue('3')">3</button>
      <button class="operator" onclick="addValue('-')">−</button>

      <button
        onclick="addValue('0')"
        style="grid-column: span 2;">
        0
      </button>

      <button onclick="addValue('.')">.</button>

      <button
        class="operator"
        onclick="addValue('+')">
        +
      </button>

      <button
        class="equals"
        style="grid-column: span 4;"
        onclick="calculate()">
        =
      </button>

    </div>

    <!-- History -->
    <div class="history">

      <div class="history-header">
        <h3>History</h3>

        <button
          id="clearHistory"
          onclick="clearHistory()">
          Clear
        </button>
      </div>

      <div id="historyList"></div>

    </div>

  </div>


<script>

const display = document.getElementById("display");
const historyList = document.getElementById("historyList");


// -----------------------------
// DISPLAY
// -----------------------------

function addValue(value) {

  if (
    display.value === "0" ||
    display.value === "Error"
  ) {
    display.value = value;
  } else {
    display.value += value;
  }
}


// -----------------------------
// CLEAR
// -----------------------------

function clearDisplay() {
  display.value = "0";
}


// -----------------------------
// DELETE
// -----------------------------

function deleteLast() {

  if (
    display.value === "Error" ||
    display.value.length <= 1
  ) {
    display.value = "0";
    return;
  }

  display.value =
    display.value.slice(0, -1);
}


// -----------------------------
// CALCULATE
// -----------------------------

function calculate() {

  try {

    let expression = display.value;

    if (!expression.trim()) {
      return;
    }

    /*
      Only allow characters that
      are useful for this calculator.
    */

    if (!/^[0-9+\-*/().%\s]+$/.test(expression)) {

      display.value = "Error";
      return;
    }

    /*
      Function() is used instead of eval().
      The expression has already been
      restricted to calculator characters.
    */

    let result = Function(
      '"use strict"; return (' +
      expression +
      ')'
    )();

    if (!Number.isFinite(result)) {

      display.value = "Error";
      return;
    }

    /*
      Avoid unnecessary decimal digits.
    */

    result =
      Number.isInteger(result)
      ? result
      : Number(result.toFixed(10));

    addHistory(
      expression + " = " + result
    );

    display.value = result;

  } catch (error) {

    display.value = "Error";

  }
}


// -----------------------------
// SQUARE ROOT
// -----------------------------

function sqrt() {

  let value = Number(display.value);

  if (value < 0) {

    display.value = "Error";
    return;
  }

  let result = Math.sqrt(value);

  display.value =
    formatNumber(result);
}


// -----------------------------
// SQUARE
// -----------------------------

function square() {

  let value = Number(display.value);

  let result = value * value;

  display.value =
    formatNumber(result);
}


// -----------------------------
// POWER
// -----------------------------

function power() {

  display.value += "**";
}


// -----------------------------
// PERCENT
// -----------------------------

function percent() {

  let value = Number(display.value);

  display.value =
    formatNumber(value / 100);
}


// -----------------------------
// SIN
// -----------------------------

function sin() {

  let value = Number(display.value);

  let result =
    Math.sin(
      value * Math.PI / 180
    );

  display.value =
    formatNumber(result);
}


// -----------------------------
// COS
// -----------------------------

function cos() {

  let value = Number(display.value);

  let result =
    Math.cos(
      value * Math.PI / 180
    );

  display.value =
    formatNumber(result);
}


// -----------------------------
// TAN
// -----------------------------

function tan() {

  let value = Number(display.value);

  let result =
    Math.tan(
      value * Math.PI / 180
    );

  display.value =
    formatNumber(result);
}


// -----------------------------
// LOG
// -----------------------------

function log() {

  let value = Number(display.value);

  if (value <= 0) {

    display.value = "Error";
    return;
  }

  let result =
    Math.log10(value);

  display.value =
    formatNumber(result);
}


// -----------------------------
// NUMBER FORMAT
// -----------------------------

function formatNumber(number) {

  if (!Number.isFinite(number)) {
    return "Error";
  }

  if (Number.isInteger(number)) {
    return number.toString();
  }

  return Number(
    number.toFixed(10)
  ).toString();
}


// -----------------------------
// HISTORY
// -----------------------------

function addHistory(text) {

  let history =
    JSON.parse(
      localStorage.getItem(
        "mycalc-history"
      )
    ) || [];

  history.unshift(text);

  /*
    Keep only the latest 50
    calculations.
  */

  history =
    history.slice(0, 50);

  localStorage.setItem(
    "mycalc-history",
    JSON.stringify(history)
  );

  displayHistory();
}


// -----------------------------
// DISPLAY HISTORY
// -----------------------------

function displayHistory() {

  let history =
    JSON.parse(
      localStorage.getItem(
        "mycalc-history"
      )
    ) || [];

  historyList.innerHTML = "";

  if (history.length === 0) {

    historyList.innerHTML =
      '<div class="empty-history">' +
      'No calculations yet' +
      '</div>';

    return;
  }

  history.forEach(function(item) {

    let div =
      document.createElement("div");

    div.className =
      "history-item";

    div.textContent = item;

    historyList.appendChild(div);

  });
}


// -----------------------------
// CLEAR HISTORY
// -----------------------------

function clearHistory() {

  localStorage.removeItem(
    "mycalc-history"
  );

  displayHistory();
}


// -----------------------------
// LOAD HISTORY
// -----------------------------

displayHistory();


// -----------------------------
// SERVICE WORKER
// -----------------------------

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register(
          "service-worker.js"
        )
        .then(function() {

          console.log(
            "MyCalc service worker registered."
          );

        })
        .catch(function(error) {

          console.log(
            "Service worker error:",
            error
          );

        });

    }
  );

}

</script>

</body>
</html>
